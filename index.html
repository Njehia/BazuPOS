<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bazu POS</title>
    <meta name="description" content="Cloud-connected, real-time synchronized Point of Sale (POS) application for liquor retail in Nairobi with multi-device live sync across computers and phones, secure username &amp; password staff login, M-Pesa &amp; Cash checkout, inventory control, and sales auditing." />
    <meta property="og:title" content="Bazu POS" />
    <meta property="og:description" content="Cloud-connected, real-time synchronized Point of Sale (POS) application for liquor retail in Nairobi with multi-device live sync across computers and phones, secure username &amp; password staff login, M-Pesa &amp; Cash checkout, inventory control, and sales auditing." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0A1124" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bazu POS" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('bazu_pos_theme_mode');
          if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
