<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bazu POS</title>

    <meta property="og:title" content="Bazu POS" />
    <meta property="og:description" content="Cloud-connected, real-time synchronized Point of Sale (POS) application for liquor retail in Nairobi with multi-device live sync across computers and phones, secure username &amp; password staff login, M-Pesa &amp; Cash checkout, inventory control, and sales auditing." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0A1124" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bazu POS" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      (function() {
        // Suppress expected benign [vite] websocket connection logs in iframe dev environment
        var originalWarn = console.warn;
        var originalError = console.error;
        var originalDebug = console.debug;
        var originalLog = console.log;
        var originalInfo = console.info;

        var isViteHmrMsg = function(args) {
          try {
            if (!args || !args.length) return false;
            var fullMsg = '';
            for (var i = 0; i < args.length; i++) {
              var a = args[i];
              if (a === null || a === undefined) continue;
              if (typeof a === 'string') {
                fullMsg += ' ' + a;
              } else if (typeof a === 'object') {
                fullMsg += ' ' + (a.message || a.stack || (function() {
                  try { return JSON.stringify(a); } catch(e) { return ''; }
                })());
              } else {
                fullMsg += ' ' + String(a);
              }
            }
            if (fullMsg.indexOf('[vite]') !== -1) {
              return true;
            }
            if (
              fullMsg.indexOf('failed to connect to websocket') !== -1 ||
              fullMsg.indexOf('WebSocket connection to') !== -1 ||
              fullMsg.indexOf('server connection lost') !== -1
            ) {
              return true;
            }
            return false;
          } catch(e) { return false; }
        };

        console.error = function() {
          if (isViteHmrMsg(arguments)) return;
          originalError.apply(console, arguments);
        };
        console.warn = function() {
          if (isViteHmrMsg(arguments)) return;
          originalWarn.apply(console, arguments);
        };
        console.debug = function() {
          if (isViteHmrMsg(arguments)) return;
          originalDebug.apply(console, arguments);
        };
        console.log = function() {
          if (isViteHmrMsg(arguments)) return;
          originalLog.apply(console, arguments);
        };
        console.info = function() {
          if (isViteHmrMsg(arguments)) return;
          originalInfo.apply(console, arguments);
        };

        window.addEventListener('error', function(event) {
          try {
            var msg = event && event.message ? String(event.message) : '';
            if (msg.indexOf('[vite]') !== -1 || msg.indexOf('WebSocket') !== -1) {
              event.preventDefault();
              if (typeof event.stopImmediatePropagation === 'function') {
                event.stopImmediatePropagation();
              }
              return true;
            }
          } catch(e) {}
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          try {
            var reason = event && event.reason ? String(event.reason.message || event.reason) : '';
            if (reason.indexOf('[vite]') !== -1 || reason.indexOf('WebSocket') !== -1) {
              event.preventDefault();
              if (typeof event.stopImmediatePropagation === 'function') {
                event.stopImmediatePropagation();
              }
              return true;
            }
          } catch(e) {}
        }, true);

        try {
          var saved = localStorage.getItem('bazu_pos_theme_mode');
          if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
